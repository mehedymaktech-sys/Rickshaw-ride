<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>রিকশা রাইড: ঢাকা ড্রিফট</title>
  <style>
/* পুরো পাতার ব্যাকগ্রাউন্ড ও ফন্ট */
html, body { margin: 0; height: 100%; background: #2b2a4c;
  font-family: "Noto Sans Bengali", "Hind Siliguri", "Kalpurush", sans-serif; }
body { display: flex; align-items: center; justify-content: center; }

/* ক্যানভাস ও প্যানেলের কনটেইনার */
#wrap { position: relative; height: min(100vh, 720px); aspect-ratio: 480 / 720; }
canvas { width: 100%; height: 100%; display: block; border-radius: 12px; }

/* মেনু/শপ প্যানেল (ক্যানভাসের উপরে ভাসে) */
#panel { position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px; padding: 20px;
  background: rgba(43, 42, 76, .93); color: #fff; text-align: center; border-radius: 12px; }
#panel.hidden { display: none; }
h1 { margin: 0; font-size: 44px; color: #ffd23f; text-shadow: 3px 3px 0 #e8505b; }
h2 { margin: 0 0 8px; font-size: 26px; color: #7fe0c3; }
#result { font-size: 20px; margin: 4px 0; min-height: 24px; }
#wallet { font-size: 22px; font-weight: bold; color: #ffd23f; margin: 0; }

/* আপগ্রেড বোতামের তালিকা */
#upgrades { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 340px; }
.up { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
  background: #fff; color: #2b2a4c; border: 3px solid #ffd23f; border-radius: 14px;
  font-size: 16px; cursor: pointer; font-family: inherit; }
.up:disabled { opacity: .45; cursor: not-allowed; }
.up:not(:disabled):hover { background: #fff3c4; }

/* শুরু বোতাম */
#play { margin-top: 10px; padding: 12px 36px; font-size: 22px; font-family: inherit;
  background: #e8505b; color: #fff; border: 0; border-radius: 30px; cursor: pointer;
  box-shadow: 0 5px 0 #a82d37; }
#play:active { transform: translateY(4px); box-shadow: 0 1px 0 #a82d37; }
.hint { font-size: 14px; opacity: .8; margin: 6px 0 0; }

/* মোবাইলের টাচ বোতাম (ক্যানভাসের নিচের দিকে) */
#touch { position: absolute; left: 0; right: 0; bottom: 10px; display: flex;
  justify-content: space-between; align-items: flex-end; padding: 0 12px; pointer-events: none; }
#touch button { pointer-events: auto; width: 72px; height: 72px; border-radius: 50%; border: 3px solid #fff;
  background: rgba(255, 255, 255, .3); color: #fff; font-size: 28px; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#touch button.on { background: rgba(255, 210, 63, .75); }
#bH { background: rgba(232, 80, 91, .55); }

/* শপ/মেনু খোলা থাকলে টাচ বোতাম লুকানো থাকে; মাউসওয়ালা ডেস্কটপেও লুকানো */
#panel:not(.hidden) ~ #touch { display: none; }
@media (hover: hover) and (pointer: fine) { #touch { display: none; } }
/* আপগ্রেড বোতামের লেখা বাঁ দিকে */
.up span { text-align: left; }

/* ছোট স্ক্রিনে গেম যেন কেটে না যায়: প্রস্থ স্ক্রিনের মাপ অনুযায়ী ঠিক হয় */
#wrap { height: auto; width: min(100vw, calc(100vh * 2 / 3), 480px); }
@supports (height: 100dvh) { #wrap { width: min(100vw, calc(100dvh * 2 / 3), 480px); } }
#panel { overflow-y: auto; box-sizing: border-box; }
@media (max-width: 440px) {
  h1 { font-size: 34px; } h2 { font-size: 20px; margin-bottom: 2px; }
  #result { font-size: 15px; } #wallet { font-size: 18px; }
  .up { padding: 7px 10px; font-size: 14px; } #upgrades { gap: 6px; }
  #play { padding: 9px 30px; font-size: 19px; margin-top: 6px; }
  #touch button { width: 60px; height: 60px; font-size: 24px; }
}

/* গতি ও ব্রেক বোতাম */
.grp { display: flex; gap: 8px; }
#bB, #bG { font-family: inherit; font-size: 15px; font-weight: bold; }
#bB { background: rgba(232, 80, 91, .6); }
#bG { background: rgba(46, 158, 79, .65); }

/* রুট বাছাইয়ের বোতাম */
.lbl { margin: 4px 0 0; font-size: 14px; color: #7fe0c3; }
#routes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 380px; }
.rt { padding: 6px 10px; border-radius: 14px; border: 2px solid #7fe0c3; background: transparent; color: #fff;
  font-family: inherit; font-size: 13px; cursor: pointer; }
.rt.sel { background: #7fe0c3; color: #2b2a4c; font-weight: bold; }
#panel { justify-content: safe center; }

.rt:last-child { border-color: #ffd23f; }
.rt.sel:last-child { background: #ffd23f; }

</style>
</head>
<body>
  <!-- গেমের মূল ক্যানভাস এবং তার উপরের মেনু/শপ একসাথে এই বক্সে -->
  <div id="wrap">
    <canvas id="game" width="480" height="720"></canvas>

    <!-- শুরুর মেনু, গেম ওভার ও শপ — সবই এই একটি প্যানেলে -->
    <div id="panel">
      <h1>রিকশা রাইড</h1>
      <h2>ঢাকা ড্রিফট</h2>
      <p id="result"></p>
      <p id="wallet"></p>
      <p class="lbl">ঢাকার রুট বেছে নিন</p>
      <div id="routes"></div>
      <div id="upgrades"></div>
      <button id="play">খেলা শুরু</button>
      <p class="hint">← → ঘোরাও &nbsp;|&nbsp; ↑ গতি &nbsp;|&nbsp; ↓ ব্রেক &nbsp;|&nbsp; Space = হর্ন<br>মোবাইলে নিচের বোতাম ব্যবহার করুন</p>
    </div>

    <!-- মোবাইলের টাচ বোতাম -->
    <div id="touch">
      <div class="grp"><button id="bL" aria-label="বামে">◀</button><button id="bR" aria-label="ডানে">▶</button></div>
      <button id="bH" aria-label="হর্ন">📣</button>
      <div class="grp"><button id="bB" aria-label="ব্রেক">ব্রেক</button><button id="bG" aria-label="গতি বাড়াও">গতি</button></div>
    </div>
  </div>
  <script>
// ===== রিকশা রাইড: ঢাকা ড্রিফট =====
const cv = document.getElementById('game'), c = cv.getContext('2d');
const W = 480, H = 720;
const ROAD_L = 60, ROAD_R = 420;           // রাস্তার বাম-ডান সীমা
const bn = n => Math.round(n).toLocaleString('bn-BD'); // বাংলা সংখ্যা

// ---------- সেভ ডেটা (টাকা ও আপগ্রেড লেভেল) ----------
const defSave = () => ({ money: 0, speed: 0, horn: 0, pat: 0 });
let save;
try { save = JSON.parse(localStorage.getItem('rickshaw')) || defSave(); } catch (e) { save = defSave(); }
const store = () => { try { localStorage.setItem('rickshaw', JSON.stringify(save)); } catch (e) {} };

// ---------- ঢাকার রুটসমূহ: প্রতিটির আলাদা স্টপ ও পরিবেশ (স্টপগুলো বাস-রুট ও সংবাদ থেকে মিলিয়ে নেওয়া) ----------
const PAL0 = ['#e9c46a', '#f4a261', '#8ecae6', '#cdb4db', '#b5c99a', '#e76f51'];
const SIGNS0 = ['ফার্মেসি', 'মোবাইল সেন্টার', 'হোটেল', 'মিষ্টি ঘর', 'ইলেকট্রনিক্স', 'ব্যাংক', 'ক্লিনিক', 'কাপড়ের দোকান'];
// sky = আকাশের দুই রঙ, fly = বাঁয়ে ফ্লাইওভার, bldL = বাঁয়ে বাড়ি, treeP = গাছের সম্ভাবনা, rikW = রিকশার ভিড়, dens = বাড়ির ঘনত্ব
const ROUTES = [
  { name: 'কুড়িল–মালিবাগ', stops: ['কুড়িল', 'যমুনা ফিউচার পার্ক', 'নতুন বাজার', 'বাড্ডা', 'রামপুরা', 'মালিবাগ'],
    sky: ['#9fa8ba', '#e4e7ee'], ground: '#5b9a46', fly: true, bldL: false, treeP: .6, rikW: .12 },
  { name: 'বিমানবন্দর সড়ক', stops: ['বিমানবন্দর', 'খিলক্ষেত', 'কুড়িল', 'কাকলী', 'বনানী', 'মহাখালী', 'ফার্মগেট'],
    sky: ['#8ecae6', '#eef3f8'], ground: '#4f9d3a', fly: true, bldL: false, treeP: .85, rikW: .06 },
  { name: 'মিরপুর রোড', stops: ['মিরপুর-১', 'টেকনিক্যাল', 'কল্যাণপুর', 'শ্যামলী', 'আসাদ গেট', 'ধানমন্ডি ২৭', 'সায়েন্স ল্যাব'],
    sky: ['#b3b6c8', '#e9e7ef'], ground: '#6f9650', fly: false, bldL: true, treeP: .25, rikW: .22, dens: 90 },
  { name: 'সদরঘাট–যাত্রাবাড়ী', stops: ['সদরঘাট', 'গুলিস্তান', 'দৈনিক বাংলা', 'রাজারবাগ', 'কমলাপুর', 'যাত্রাবাড়ী'],
    sky: ['#c8b79a', '#efe3cf'], ground: '#8a7f6a', fly: false, bldL: true, treeP: .05, rikW: .4, dens: 60,

    signs: ['মিষ্টি ঘর', 'সোনার দোকান', 'বই বাজার', 'কাপড়ের হাট', 'কাচ্চি ঘর', 'ওষুধের দোকান'] },
  { name: 'ফার্মগেট–গুলিস্তান', stops: ['ফার্মগেট', 'কাওরান বাজার', 'বাংলা মোটর', 'শাহবাগ', 'প্রেস ক্লাব', 'গুলিস্তান'],
    sky: ['#9fb4cc', '#e8edf3'], ground: '#6b8f58', fly: true, bldL: false, treeP: .3, rikW: .18, dens: 90 },
  { name: 'উত্তরা', stops: ['বিমানবন্দর', 'জসিমউদ্দিন', 'রাজলক্ষ্মী', 'হাউজ বিল্ডিং', 'আব্দুল্লাহপুর'],
    sky: ['#86c5f0', '#f0f6fb'], ground: '#4f9d3a', fly: false, bldL: true, treeP: .9, rikW: .1, dens: 140 },
  { name: 'গুলশান–বাড্ডা', stops: ['মহাখালী', 'গুলশান-১', 'গুলশান-২', 'নতুন বাজার', 'বাড্ডা'],
    sky: ['#a9c4de', '#edf2f7'], ground: '#5f9a4a', fly: false, bldL: true, treeP: .5, rikW: .05, dens: 100,
    pal: ['#dfe7ef', '#cfd8e3', '#e9eef4', '#b8c4d0', '#c9d6e2'],
    signs: ['ব্যাংক', 'রেস্টুরেন্ট', 'কফি শপ', 'ফ্যাশন হাউস', 'ক্লিনিক', 'সুপারশপ', 'ইলেকট্রনিক্স'] },
  { name: 'মতিঝিল', stops: ['সায়েদাবাদ', 'মতিঝিল', 'ফকিরাপুল', 'মগবাজার', 'মহাখালী'],
    sky: ['#aab2c2', '#e6e8ee'], ground: '#7a8a72', fly: false, bldL: true, treeP: .05, rikW: .1, dens: 80, hm: 1.6,
    pal: ['#aeb8c6', '#9aa7b8', '#c4ccd8', '#8d99ae', '#b8c0cc'],
    signs: ['ব্যাংক', 'বীমা', 'করপোরেট অফিস', 'ব্যাংক', 'শেয়ার বাজার', 'ফাইন্যান্স'] },
  { name: 'যাত্রাবাড়ী–সাইনবোর্ড', stops: ['যাত্রাবাড়ী', 'সানির আখড়া', 'রায়েরবাগ', 'মাতুয়াইল', 'সাইনবোর্ড'],
    sky: ['#b8bfcc', '#ebedf1'], ground: '#8a9a6a', fly: true, bldL: false, treeP: .2, rikW: .1, dens: 110 },
  { name: 'মোহাম্মদপুর–সায়েন্স ল্যাব', stops: ['বসিলা', 'মোহাম্মদপুর', 'জাপান গার্ডেন সিটি', 'শ্যামলী', 'কলেজ গেট', 'আসাদ গেট', 'কলাবাগান', 'সায়েন্স ল্যাব'],
    sky: ['#b7c4d6', '#eaeef4'], ground: '#6f9650', fly: false, bldL: true, treeP: .3, rikW: .3, dens: 90 },
];
let STAGES, LEN, THEME, routeIdx = save.route || 0;
const setTheme = r => { THEME = Object.assign({ pal: PAL0, signs: SIGNS0, dens: 125 }, r); };
function selectRoute(i) {                           // i = -১ হলে "পুরো ঢাকা": সব রুট একসাথে
  routeIdx = i; save.route = i; store();
  STAGES = []; (i < 0 ? ROUTES : [ROUTES[i]]).forEach(r => r.stops.forEach(name => STAGES.push({ at: STAGES.length * 400, name, r })));
  LEN = STAGES.length * 400; setTheme(STAGES[0].r);
}
const gpos = k => Math.floor(k / STAGES.length) * LEN + STAGES[k % STAGES.length].at;
// d মিটারের অন্তত ৬০ মি সামনের পরের স্টপ — যাত্রীর গন্তব্য
function stageAfter(d) {
  for (let k = 0; ; k++) if (gpos(k) > d + 60) return { pos: gpos(k), name: STAGES[k % STAGES.length].name };
}

const pick = a => a[Math.floor(Math.random() * a.length)];
function mkVeh(x) {
  const r = Math.random();
  if (r < .22) return { x, y: -90,  v: rnd(1.5, 2.5), ty: 'cng', len: 50,  hw: 16, col: '#2e9e4f' };
  if (r < .40) return { x, y: -110, v: rnd(1.2, 2.2), ty: 'bus', len: 120, hw: 22, col: pick(['#d6336c', '#2a9d8f', '#e63946', '#ffb703']) };
  if (r < .40 + THEME.rikW) return { x, y: -80,  v: rnd(.8, 1.4),  ty: 'rik', len: 60,  hw: 17, col: pick(['#d9532c', '#1f8a8a', '#7b2cbf']) };
  if (r < .52 + THEME.rikW) return { x, y: -90,  v: rnd(1.4, 2.4), ty: 'trk', len: 64,  hw: 18, col: '#f1f1f1' };          // সাদা পিকআপ
  return { x, y: -90, v: rnd(1.5, 3.2), ty: 'car', len: 70, hw: 20, col: pick(['#d9dde3', '#f1f1f1', '#9aa3ad', '#2f3e6b', '#c0c0c0']) };  // রূপালি/সাদা গাড়ি
}

  { k: 'pat',   name: '🧘 আরামদায়ক সিট',     desc: 'যাত্রী ধীরে বিরক্ত হয়' },
];
const MAX_LV = 5;
const cost = lv => 60 + lv * 70;

// ---------- অডিও: Web Audio দিয়ে হর্ন ----------
let actx;
function honkSound() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  const t = actx.currentTime, g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  g.connect(actx.destination);
  [330, 415].forEach(f => {                // দুটো সুর মিলে "প্যাঁ-পোঁ" হর্ন
    const o = actx.createOscillator();
    o.type = 'square'; o.frequency.value = f;
    o.connect(g); o.start(t); o.stop(t + 0.36);
  });
}

// ---------- গেমের অবস্থা ----------
let S, running = false, keys = {};
function reset() {
  setTheme(STAGES[0].r);
  S = {
    px: 240, py: 590, vx: 0, tilt: 0, v: 4 + save.speed * 0.7,
    dist: 0, roadY: 0, earned: 0, hornT: 0,
    cars: [], peds: [], stop: null, pass: null, msg: '', msgT: 0, rides: 0, signs: [], signIdx: 0, bbAcc: 0, bAcc: 0, fbAcc: 600,
    blds: [60, 190, 320, 450, 580].flatMap(y => THEME.bldL ? [mkBld(y, 0), mkBld(y, 1)] : [mkBld(y, 1)]),
    bbs: [120, 600].map(y => mkBB(y, bbN % 2)),  // শুরু থেকেই বিলবোর্ড
  };
}
const rnd = (a, b) => a + Math.random() * (b - a);
const say = t => { S.msg = t; S.msgT = 120; };

// ---------- কিবোর্ড ----------
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (e.key === ' ' && running && !keys[' ']) honk();
  keys[e.key] = true;
});
addEventListener('keyup', e => keys[e.key] = false);

// হর্ন: কাছের পথচারীরা সরে যায়
function honk() {
  honkSound(); S.hornT = 20;
  const range = 90 + save.horn * 28;
  S.peds.forEach(p => {
    if (Math.hypot(p.x - S.px, p.y - S.py) < range) {
      p.flee = true;
      p.vx = (p.x < 240 ? -1 : 1) * 3.2;   // কাছের ফুটপাতের দিকে দৌড়
    }
  });
}

// ---------- আপডেট ----------
function update() {
  // গতি: ↑ চাপলে বাড়ে, ↓ চাপলে ব্রেক; ছেড়ে দিলে আস্তে আস্তে স্বাভাবিক গতিতে ফেরে
  const cruise = 4 + save.speed * 0.7, vmax = cruise * 1.8;
  if (keys.ArrowUp) S.v += 0.09; else if (keys.ArrowDown) S.v -= 0.3; else S.v += (cruise - S.v) * 0.02;
  S.v = Math.max(0, Math.min(vmax, S.v)); const spd = S.v;
  // ডানে-বামে ঘোরা
  const steer = 3.2 + save.speed * 0.2;
  S.vx = (keys.ArrowLeft ? -steer : 0) + (keys.ArrowRight ? steer : 0);
  S.px = Math.max(ROAD_L + 22, Math.min(ROAD_R - 22, S.px + S.vx));
  S.tilt += (S.vx * 0.06 - S.tilt) * 0.2;
  // উপরে এগোনো = রাস্তা নিচে স্ক্রল
  S.roadY = (S.roadY + spd) % 80;
  S.dist += spd / 10;
  if (S.hornT > 0) S.hornT--;

  // গাড়ি তৈরি (র‍্যান্ডম লেনে)
  if (Math.random() < 0.025 + Math.min(S.dist / 20000, 0.02)) {
    const x = ROAD_L + 45 + Math.floor(Math.random() * 4) * 90;
    if (!S.cars.some(k => Math.abs(k.x - x) < 5 && k.y < 120))
      S.cars.push(mkVeh(x));
  }
  S.cars.forEach(k => k.y += spd - k.v);
  S.cars = S.cars.filter(k => k.y < H + 100 && k.y > -800);   // ব্রেক করলে সামনের গাড়ি দূরে চলে যায়

  // পথচারী তৈরি
  if (Math.random() < 0.012) {
    const left = Math.random() < 0.5;
    S.peds.push({ x: left ? ROAD_L - 25 : ROAD_R + 25, y: -20, vx: left ? 0.8 : -0.8,
      col: ['#ff6b6b', '#4ecdc4', '#ffd23f'][Math.floor(Math.random() * 3)], flee: false });
  }
  S.peds.forEach(p => { p.x += p.vx; p.y += spd; });
  S.peds = S.peds.filter(p => p.y < H + 40);

  // যাত্রীর স্টপ তৈরি
  if (!S.pass && !S.stop && Math.random() < 0.006)
    S.stop = { x: Math.random() < 0.5 ? ROAD_L + 18 : ROAD_R - 18, y: -30 };
  if (S.stop) {
    S.stop.y += spd;
    if (S.stop.y > H + 40) S.stop = null;
    else if (Math.hypot(S.stop.x - S.px, S.stop.y - S.py) < 50) {      // যাত্রী উঠল
      const t = stageAfter(S.dist); S.pass = { pat: 100, start: S.dist, dest: t.pos, name: t.name };
      S.stop = null; say('যাত্রী উঠেছে! ' + S.pass.name + ' যাবেন 🧍');
    }
  }

  // যাত্রীর ধৈর্য কমে
  if (S.pass) {
    S.pass.pat -= 0.06 * Math.pow(0.85, save.pat);
    if (S.dist >= S.pass.dest) {                                        // গন্তব্যে পৌঁছাল
      const len = S.pass.dest - S.pass.start;
      const fare = Math.round(len * 0.22 * (0.4 + S.pass.pat / 100 * 0.6));
      S.earned += fare; S.rides++; say(S.pass.name + ' পৌঁছেছি! +৳' + bn(fare)); S.pass = null;
    } else if (S.pass.pat <= 0) { say('যাত্রী রেগে নেমে গেল! 😠'); S.pass = null; }
  }

  // পথচারীকে ধাক্কা (রাস্তার ভেতরে থাকলে) — ধৈর্য কমে
  S.peds = S.peds.filter(p => {
    if (p.x > ROAD_L && p.x < ROAD_R && Math.hypot(p.x - S.px, p.y - S.py) < 24) {
      if (S.pass) S.pass.pat -= 25; say('আরে! পথচারীকে ধাক্কা! 😱'); return false;
    }
    return true;
  });

  // গাড়ির সাথে ধাক্কা = গেম ওভার
  for (const k of S.cars)
    if (Math.abs(k.x - S.px) < 17 + k.hw && S.py - k.y < 46 + k.len / 2 && S.py - k.y > -58 - k.len / 2) return gameOver();

  // দুই পাশের বিলবোর্ড (পালাক্রমে ডানে-বাঁয়ে): প্রতি ৪৮০ পিক্সেল পরপর নতুন বিলবোর্ড (ফাঁকা ফাঁকা)
  S.bbAcc += spd;
  if (S.bbAcc >= 480) { S.bbAcc = 0; S.bbs.push(mkBB(-80, bbN % 2)); }
  S.bbs.forEach(b => b.y += spd); S.bbs = S.bbs.filter(b => b.y < H + 80);
  // বাড়ি নিচে নামে, নতুন জোড়া আসে; কিছুক্ষণ পরপর ফুট ওভারব্রিজ
  S.bAcc += spd; if (S.bAcc >= THEME.dens) { S.bAcc = 0; S.blds.push(mkBld(-120, 1)); if (THEME.bldL) S.blds.push(mkBld(-120, 0)); }
  S.blds.forEach(b => b.y += spd); S.blds = S.blds.filter(b => b.y < H + 200);
  S.fbAcc += spd; if (S.fbAcc >= 1900) { S.fbAcc = 0; S.signs.push({ y: -60, fob: true }); }
  // এলাকার সাইনবোর্ড: স্টপের দূরত্বে পৌঁছালে রাস্তার উপরে আসে
  if (S.dist >= gpos(S.signIdx)) { const st = STAGES[S.signIdx % STAGES.length]; S.signs.push({ y: -40, name: st.name }); S.signIdx++; if (THEME.stops !== st.r.stops) setTheme(st.r); }
  S.signs.forEach(s => s.y += spd); S.signs = S.signs.filter(s => s.y < H + 60);
  if (S.msgT > 0) S.msgT--;
}

function gameOver() {
  running = false;
  save.money += S.earned; store();
  showPanel('💥 ধাক্কা লেগেছে! ' + bn(S.dist) + ' মিটার, ' + bn(S.rides) + ' জন যাত্রী, আয় ৳' + bn(S.earned));
}

// ---------- আঁকা ----------
// ===== ৩D রেন্ডারার (কোনো লাইব্রেরি ছাড়া: নিজস্ব পারস্পেকটিভ প্রজেকশন) =====
// ধারণা: গেমের লজিক ২D-ই আছে; আঁকার সময় (x, y) → ৩D (X ডানে, Y উপরে, Z সামনে) বানিয়ে ক্যামেরা পেছন থেকে দেখে
const CAM = { x: 0, y: 170, z: -260 }, PIT = 0.27, FOC = 430, HY0 = 480;
const CS = Math.cos(PIT), SN = Math.sin(PIT), HOR = HY0 - FOC * Math.tan(PIT);   // HOR = দিগন্তরেখা
const BLD = Array.from({ length: 16 }, (_, i) => [i * 34 - 20, 30 + (i * 37 % 50), 28 + (i * 13 % 14)]); // শহরের স্কাইলাইন
let ITEMS, TF;                                      // ITEMS = এই ফ্রেমের সব ৩D অংশ (পলিগন, বৃত্ত, লেখা)

function pj(X, Y, Z) {                              // ৩D বিন্দু → পর্দার বিন্দু
  const dx = X - CAM.x, dy = Y - CAM.y, dz = Z - CAM.z, d = dz * CS - dy * SN, k = FOC / d;
  return { x: W / 2 + dx * k, y: HY0 - (dy * CS + dz * SN) * k, d, k };
}
const tr = (x, z) => [TF.ox + x * TF.c + z * TF.s, TF.oz - x * TF.s + z * TF.c];  // মডেলের লোকাল → ওয়ার্ল্ড (ঘূর্ণনসহ)
const rgba = (hx, a) => { const n = parseInt(hx.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
function shade(col, f) {                            // রঙ গাঢ়/হালকা (আলো-ছায়া)
  const n = parseInt(col.slice(1), 16), m = v => Math.min(255, v * f) | 0;
  return `rgb(${m(n >> 16)},${m((n >> 8) & 255)},${m(n & 255)})`;
}
const face = (pts, col, f, bias = 0) => ITEMS.push({ t: 'f', pts, col: shade(col, f), bias });
function box(x0, x1, y0, y1, z0, z1, col) {         // বাক্স মডেল: ৫টি পাশ, প্রতিটির আলাদা উজ্জ্বলতা
  const P = (x, y, z) => { const [X, Z] = tr(x, z); return [X, y, Z]; };
  const a = P(x0, y0, z0), b = P(x1, y0, z0), c2 = P(x1, y1, z0), d = P(x0, y1, z0),
        e = P(x0, y0, z1), f = P(x1, y0, z1), g = P(x1, y1, z1), h = P(x0, y1, z1);
  face([a, b, c2, d], col, .85); face([e, f, g, h], col, .8); face([d, c2, g, h], col, 1.12);
  face([a, d, h, e], col, .65); face([b, c2, g, f], col, .6);
}
function wheel(x, y, z, r, t, col) {                // চাকা: X অক্ষে ১০-পাশের প্রিজম
  const N = 10, ring = (xx, i) => { const a = i / N * 6.283, [X, Z] = tr(xx, z + Math.cos(a) * r); return [X, y + Math.sin(a) * r, Z]; };
  for (let i = 0; i < N; i++) face([ring(x - t, i), ring(x + t, i), ring(x + t, i + 1), ring(x - t, i + 1)], col, .75 + .4 * Math.sin(i / N * 6.283));
  [x - t, x + t].forEach(xx => face(Array.from({ length: N }, (_, i) => ring(xx, i)), '#9a9a9a', .9));
}
const pic = (x, y, z, img, w, h) => { const [X, Z] = tr(x, z); ITEMS.push({ t: 'i', X, y, Z, img, w, h, bias: 40 }); };   // বোর্ডের গায়ে ছবি
const disc = (x, y, z, r, col) => { const [X, Z] = tr(x, z); ITEMS.push({ t: 'd', X, y, Z, r, col }); };          // ক্যামেরামুখী গোল নকশা
const text = (x, y, z, s, size, col) => { const [X, Z] = tr(x, z); ITEMS.push({ t: 't', X, y, Z, s, size, col, bias: 40 }); }; // ভাসমান লেখা
function sidewin(ix, y0, y1, z0, z1) {              // বাড়ির গায়ে জানালা
  const P = (y, z) => { const [X, Z] = tr(ix, z); return [X, y, Z]; };
  face([P(y0, z0), P(y0, z1), P(y1, z1), P(y1, z0)], '#bfe9ff', 1, 60);
}
function strip(x0, x1, z0, z1, col) {               // মাটিতে সমতল ফালি (রাস্তা, দাগ)
  const p = [pj(x0, 0, z0), pj(x1, 0, z0), pj(x1, 0, z1), pj(x0, 0, z1)];
  c.fillStyle = col; c.beginPath(); p.forEach((q, i) => i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)); c.fill();
}
const at = (x, y) => { TF = { ox: x - 240, oz: S.py - y, c: 1, s: 0 }; };  // ২D অবস্থান → ৩D অবস্থান

function render3D() {
  CAM.x = (S.px - 240) * .8; ITEMS = [];
  // আকাশ, স্কাইলাইন, মাঠ
  const g = c.createLinearGradient(0, 0, 0, HOR); g.addColorStop(0, THEME.sky[0]); g.addColorStop(1, THEME.sky[1]);   // মেঘলা আকাশ
  c.fillStyle = g; c.fillRect(0, 0, W, HOR);
  c.fillStyle = '#a7aebf'; BLD.forEach(q => c.fillRect(q[0] - CAM.x * .05, HOR - q[1], q[2], q[1]));
  c.fillStyle = THEME.ground; c.fillRect(0, HOR, W, H - HOR);
  // রাস্তা, কিনারা, লেনের দাগ
  strip(-330, -196, -250, 4000, '#64676e');                            // উল্টো দিকের রাস্তা
  strip(-186, 186, -250, 4000, '#64676e'); strip(-184, -180, -250, 4000, '#eeeeee'); strip(180, 184, -250, 4000, '#eeeeee');
  strip(196, 250, -250, 4000, '#b9b3a8');   // কংক্রিটের ফুটপাত
  for (let k = 0; k < 26; k++) { const z = -(S.roadY % 80) + 80 * k - 240; if (z + 40 > -250) [-90, 0, 90].forEach(x => strip(x - 3, x + 3, Math.max(z, -250), z + 40, '#fff')); }
  if (S.hornT > 0) {                                // হর্নের তরঙ্গ (মাটিতে বৃত্ত)
    const R = 90 + save.horn * 28 - S.hornT * 2;
    c.strokeStyle = `rgba(255,255,255,${S.hornT / 20})`; c.lineWidth = 3; c.beginPath();
    for (let i = 0; i <= 32; i++) { const a = i / 32 * 6.283, q = pj(S.px - 240 + Math.cos(a) * R, 0, Math.sin(a) * R); i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y); }
    c.stroke();
  }
  // এক্সপ্রেসওয়ে-ধাঁচ (ছবি দেখে): বাঁয়ে মিডিয়ান ও ফ্লাইওভার, ডানে লাল-সাদা রেলিং, লাইটপোস্ট
  const wp = S.dist * 10, per = (P, f) => { for (let z = -(wp % P) - 240; z < 620; z += P) f(z, Math.round((z + wp) / P)); };
  TF = { ox: 0, oz: 0, c: 1, s: 0 };
  per(80, (z, i) => { box(-196, -186, 0, 14, z, z + 78, '#c4c7cc'); box(-192, -190, 14, 30, z, z + 78, '#4a4e59');
    if (i % 4 === 0) box(-196, -186, 0, 14, z, z + 20, '#f4c20d'); });                  // মিডিয়ান ও হলুদ-কালো ব্লক
  per(40, (z, i) => box(186, 196, 0, 16, z, z + 40, i % 2 ? '#d62828' : '#f1f1f1'));   // লাল-সাদা রেলিং
  if (THEME.fly) per(120, z => { box(-520, -330, 70, 86, z, z + 120, '#b8bcc4'); box(-520, -516, 86, 96, z, z + 120, '#d62828');
    box(-334, -330, 86, 96, z, z + 120, '#f1f1f1'); box(-430, -420, 0, 70, z + 50, z + 62, '#a3a8b0'); });   // ফ্লাইওভার
  per(240, z => { box(187, 190, 0, 115, z, z + 3, '#6c757d'); box(150, 190, 112, 115, z, z + 3, '#6c757d'); box(146, 158, 108, 112, z, z + 3, '#fff3a0'); });
  // দুই পাশের বহুতল বাড়ি: দোকানের সাইনবোর্ড ও জানালাসহ
  S.blds.forEach(b => { const X = (b.side ? 1 : -1) * (345 + b.w / 2); at(240 + X, b.y);
    if (b.tree) { box(-3, 3, 0, 34, -3, 3, '#6d4c41'); disc(0, 56, 0, 26, '#2e7d32'); disc(-16, 46, 2, 18, '#3a9a45'); disc(16, 48, 2, 18, '#256d2b'); return; }
    const ix = b.side ? -b.w / 2 : b.w / 2, off = b.side ? -.6 : .6;
    box(-b.w / 2, b.w / 2, 0, b.h, -55, 55, b.col); text(ix, 24, 0, b.sign, 15, '#fff');
    for (let r = 0; r < Math.floor((b.h - 50) / 40); r++) [-28, 28].forEach(z => sidewin(ix + off, 55 + r * 40, 80 + r * 40, z - 12, z + 12)); });
  // বিলবোর্ড: দুই খুঁটি + বোর্ড + বিজ্ঞাপনের লেখা
  S.bbs.forEach(b => { at(b.side ? 490 : -10, b.y + 35); const l = b.logo, hw = l.w / 2 + 4, y0 = 46;   // ডান ফুটপাতে
    box(-hw + 6, -hw + 10, 0, y0, -2, 2, '#555'); box(hw - 10, hw - 6, 0, y0, -2, 2, '#555');   // দুই খুঁটি
    box(-hw, hw, y0, y0 + l.h + 8, -3, 3, '#ffffff');                                          // সাদা বোর্ড
    pic(0, y0 + 4 + l.h / 2, -4, l.img, l.w, l.h); });                                         // লোগো
  // এলাকার সাইনবোর্ড (রাস্তার উপর গেন্ট্রি)
  S.signs.forEach(s => { at(240, s.y);
    if (s.fob) {                                    // ফুট ওভারব্রিজ: খুঁটি, ধূসর ডেক, লাল রেলিং
      box(-190, -182, 0, 98, -5, 5, '#6c757d'); box(182, 190, 0, 98, -5, 5, '#6c757d');
      box(-190, 190, 90, 98, -6, 6, '#8d99ae'); box(-190, 190, 98, 104, -6, -4, '#e63946'); text(0, 76, -7, 'ফুট ওভারব্রিজ', 13, '#fff'); return;
    } box(-190, -182, 0, 120, -4, 4, '#2b2a4c'); box(182, 190, 0, 120, -4, 4, '#2b2a4c');
    box(-182, 182, 88, 120, -3, 3, '#1b7f4b'); text(0, 98, -5, s.name, 22, '#fff'); });
  // গাড়ি: বডি, কাচের কেবিন, চাকা, পেছনের লাল বাতি
  S.cars.forEach(k => { at(k.x, k.y); const L = k.len / 2, tail = (x, y) => disc(x, y, -L - .5, 3.5, '#ff3b3b');
    const tyre = (x, z, h, l) => box(x - 2.5, x + 2.5, 0, h, z - l, z + l, '#2b2a4c');
    if (k.ty === 'bus') {                           // লোকাল বাস: লম্বা, উঁচু, সাদা ডোরা
      box(-22, 22, 6, 52, -L, L, k.col); box(-22.5, 22.5, 26, 32, -L, L, '#fff'); box(-20, 20, 36, 48, L - 1, L, '#bfe9ff');
      [-1, 1].forEach(s => [-L + 18, L - 18].forEach(z => tyre(s * 23, z, 12, 8)));
      text(0, 40, -L - 1, 'ঢাকা পরিবহন', 12, '#fff'); tail(-14, 12); tail(14, 12);
    } else if (k.ty === 'cng') {                    // সবুজ সিএনজি অটো
      box(-16, 16, 5, 20, -L, L, k.col); box(-14, 14, 20, 34, -L + 6, L - 12, '#2e9e4f'); box(-14, 14, 34, 36, -L + 6, L - 12, '#1c6b34');
      [-1, 1].forEach(s => [-L + 10, L - 10].forEach(z => tyre(s * 17, z, 10, 6))); tail(-9, 12); tail(9, 12);
    } else if (k.ty === 'rik') {                    // অন্য রিকশা (ছোট মডেল)
      [-1, 1].forEach(s => wheel(s * 18, 12, -L + 14, 12, 2, '#2b2a4c'));
      box(-14, 14, 8, 24, -L, L - 22, '#f2b632'); box(-16, 16, 28, 44, -L, -L + 28, k.col);
      box(-1.5, 1.5, 12, 15, L - 24, L, '#a83a1e'); wheel(0, 12, L - 4, 12, 2, '#2b2a4c');
      box(-6, 6, 24, 40, L - 28, L - 18, '#2b7a78'); disc(0, 46, L - 23, 5, '#f1c27d');
      disc(-6, 40, -L - .5, 4, '#3a86ff'); disc(6, 40, -L - .5, 4, '#ffd23f');
    } else if (k.ty === 'trk') {                    // সাদা পিকআপ ট্রাক
      box(-17, 17, 5, 34, L - 24, L, k.col); box(-18, 18, 5, 18, -L, L - 24, '#8d99ae'); box(-14, 14, 26, 32, L - 22, L - 20, '#bfe9ff');
      [-1, 1].forEach(s => [-L + 14, L - 12].forEach(z => tyre(s * 19, z, 11, 7))); tail(-11, 12); tail(11, 12);
    } else {                                        // প্রাইভেট গাড়ি
      box(-20, 20, 5, 20, -L, L, k.col); box(-15, 15, 20, 32, -24, 10, '#bfe9ff');
      [-1, 1].forEach(s => { tail(s * 12, 13); [-20, 20].forEach(z => tyre(s * 21, z, 10, 7)); });
    }
  });
  // পথচারী ও অপেক্ষারত যাত্রী
  S.peds.forEach(p => { at(p.x, p.y); box(-6, 6, 0, 22, -4, 4, p.col); disc(0, 28, 0, 6, '#f1c27d'); if (p.flee) text(0, 46, 0, '!', 18, '#fff'); });
  if (S.stop) { at(S.stop.x, S.stop.y); box(-6, 6, 0, 22, -4, 4, '#ff6b9d'); disc(0, 28, 0, 6, '#f1c27d'); text(0, 52, 0, 'যাত্রী!', 15, '#fff'); }
  // ঢাকাই রিকশা ৩D মডেল (সামনে +Z): লাল হুড, হলুদ বডি, দুই নীল পাখি ও ফুল
  TF = { ox: S.px - 240, oz: -26, c: Math.cos(S.tilt * .8), s: Math.sin(S.tilt * .8) };
  [-1, 1].forEach(s => wheel(s * 22, 14, -12, 14, 2.5, '#2b2a4c'));
  box(-17, 17, 8, 28, -30, 16, '#f2b632'); box(-14, 14, 28, 34, -6, 14, '#d9532c');
  box(-19, 19, 34, 54, -32, 4, '#d9532c'); box(-20, 20, 33, 36, -33, 5, '#f2b632');
  if (S.pass) { box(-7, 7, 34, 46, 4, 11, '#ff6b9d'); disc(0, 51, 7, 5, '#f1c27d'); }
  box(-1.5, 1.5, 14, 17, 16, 52, '#a83a1e'); wheel(0, 14, 58, 14, 2.5, '#2b2a4c'); box(-1.5, 1.5, 14, 40, 55, 58, '#a83a1e');
  box(-14, 14, 38, 41, 52, 55, '#2b2a4c');
  box(-4, 4, 26, 29, 28, 38, '#2b2a4c'); box(-7, 7, 29, 47, 28, 38, '#2b7a78'); disc(0, 53, 33, 5.5, '#f1c27d'); disc(0, 57, 33, 3.5, '#fff');
  [-1, 1].forEach(s => { disc(s * 10, 46, -32.5, 5.5, '#3a86ff'); disc(s * 7, 48, -33, 1.3, '#fff'); disc(s * 13, 40, -32.6, 3.5, '#ffd23f'); });
  disc(0, 43, -33, 6, '#ffd23f'); disc(0, 43, -33.6, 3, '#1f8a8a');
  // প্রজেকশন, গভীরতা অনুযায়ী সাজানো (দূর আগে, কাছে পরে), তারপর আঁকা
  const list = ITEMS.filter(it => {
    if (it.t === 'f') { it.q = it.pts.map(p => pj(p[0], p[1], p[2])); it.d = it.q.reduce((s, q) => s + q.d, 0) / it.q.length - (it.bias || 0); return it.q.every(q => q.d > 15); }
    it.q = pj(it.X, it.y, it.Z); it.d = it.q.d - (it.bias || 0); return it.q.d > 15;
  }).sort((p, q) => q.d - p.d);
  list.forEach(it => {
    if (it.t === 'f') { c.fillStyle = it.col; c.beginPath(); it.q.forEach((q, i) => i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(43,42,76,.45)'; c.lineWidth = 1; c.stroke(); }
    else if (it.t === 'd') { c.fillStyle = it.col; c.beginPath(); c.arc(it.q.x, it.q.y, it.r * it.q.k, 0, 7); c.fill(); }
    else if (it.t === 'i') { if (it.img.complete && it.img.naturalWidth) c.drawImage(it.img, it.q.x - it.w * it.q.k / 2, it.q.y - it.h * it.q.k / 2, it.w * it.q.k, it.h * it.q.k); }
    else { const sz = it.size * it.q.k; if (sz < 5) return; c.font = `bold ${sz}px sans-serif`; c.textAlign = 'center';
      c.lineWidth = sz / 5; c.strokeStyle = '#2b2a4c'; c.strokeText(it.s, it.q.x, it.q.y); c.fillStyle = it.col; c.fillText(it.s, it.q.x, it.q.y); }
  });
  c.textAlign = 'left';
  const fog = c.createLinearGradient(0, HOR, 0, HOR + 85);  // দূরের কুয়াশা (হঠাৎ উদয় ঢাকে)
  fog.addColorStop(0, rgba(THEME.sky[1], 1)); fog.addColorStop(1, rgba(THEME.sky[1], 0));
  c.fillStyle = fog; c.fillRect(0, HOR, W, 85);
}
function drawRoute() {                              // রুটের অগ্রগতি: কুড়িল → মালিবাগ
  const a = STAGES[Math.max(0, S.signIdx - 1) % STAGES.length].name, x0 = 250, x1 = 466;
  c.fillStyle = '#fff'; c.font = 'bold 12px sans-serif'; c.fillText('📍 ' + a, 12, 62);
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x0, 57, x1 - x0, 3);
  c.fillStyle = '#fff';
  STAGES.forEach(st => { c.beginPath(); c.arc(x0 + st.at / LEN * (x1 - x0), 58.5, STAGES.length > 12 ? 1.6 : 3, 0, 7); c.fill(); });
  c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(x0 + (S.dist % LEN) / LEN * (x1 - x0), 58.5, 5.5, 0, 7); c.fill();
}
function drawHUD() {
  c.fillStyle = 'rgba(43,42,76,.85)'; c.fillRect(0, 0, W, 68); drawRoute();
  c.fillStyle = '#ffd23f'; c.font = 'bold 18px sans-serif';
  c.fillText('৳ ' + bn(S.earned), 14, 30);
  c.fillStyle = '#fff'; c.fillText(bn(S.dist) + ' মি', 380, 30);
  c.font = '12px sans-serif'; c.fillText('গতি ' + bn(S.v * 4) + ' কিমি/ঘ', 380, 46);
  if (S.pass) {                                                       // ধৈর্য বার ও গন্তব্য বার
    const pt = Math.max(0, S.pass.pat) / 100, pr = (S.dist - S.pass.start) / (S.pass.dest - S.pass.start);
    bar(110, 10, 150, 12, pt, pt > .5 ? '#7fe0c3' : pt > .25 ? '#ffd23f' : '#e8505b');
    bar(110, 28, 150, 8, pr, '#3a86ff');
    c.fillStyle = '#fff'; c.font = '11px sans-serif'; c.fillText('ধৈর্য', 268, 20); c.fillText(S.pass.name, 268, 36);
  } else { c.fillStyle = '#fff'; c.font = '13px sans-serif'; c.fillText('রাস্তার ধারে যাত্রী খুঁজুন', 110, 30); }
  if (S.msgT > 0) {
    c.fillStyle = 'rgba(0,0,0,.65)'; c.fillRect(40, 80, 400, 36);
    c.fillStyle = '#fff'; c.font = 'bold 17px sans-serif'; c.textAlign = 'center';
    c.fillText(S.msg, W / 2, 104); c.textAlign = 'left';
  }
}
function bar(x, y, w, h, v, col) {
  c.fillStyle = '#fff3'; c.fillRect(x, y, w, h);
  c.fillStyle = col; c.fillRect(x, y, w * Math.max(0, Math.min(1, v)), h);
}

// ---------- মূল লুপ ----------
function loop() {
  if (running) update();
  if (S) { render3D(); drawHUD(); }
  requestAnimationFrame(loop);
}

// ---------- শপ/মেনু প্যানেল ----------
const panel = document.getElementById('panel');
function showPanel(resultText) {
  document.getElementById('result').textContent = resultText || '';
  document.getElementById('wallet').textContent = 'আপনার টাকা: ৳' + bn(save.money);
  const rb = document.getElementById('routes'); rb.innerHTML = '';           // রুট বাছাই
  [...ROUTES.map((r, i) => ({ name: r.name, i })), { name: '🌆 পুরো ঢাকা (সব রুট)', i: -1 }].forEach(({ name, i }) => { const b = document.createElement('button'); b.className = 'rt' + (i === routeIdx ? ' sel' : ''); b.textContent = name;
    b.onclick = () => { selectRoute(i); reset(); showPanel(resultText); }; rb.appendChild(b); });
  const box = document.getElementById('upgrades'); box.innerHTML = '';
  UPS.forEach(u => {
    const lv = save[u.k], maxed = lv >= MAX_LV, price = cost(lv);
    const b = document.createElement('button'); b.className = 'up';
    b.disabled = maxed || save.money < price;
    b.innerHTML = '<span>' + u.name + ' (লেভেল ' + bn(lv) + ')<br><small>' + u.desc + '</small></span><b>' + (maxed ? 'সর্বোচ্চ' : '৳' + bn(price)) + '</b>';
    b.onclick = () => { save.money -= price; save[u.k]++; store(); showPanel(resultText); }; // আপগ্রেড কেনা
    box.appendChild(b);
  });
  panel.classList.remove('hidden');
}
document.getElementById('play').onclick = () => {
  reset(); running = true; panel.classList.add('hidden');
  actx = actx || new (window.AudioContext || window.webkitAudioContext)(); // ক্লিকের পর অডিও চালু
};

selectRoute(routeIdx < ROUTES.length ? routeIdx : 0);
reset(); showPanel('রুট বেছে নিন, যাত্রী তুলুন, গাড়ি এড়ান, টাকা কামান!'); loop();

// ---------- টাচ কন্ট্রোল: বোতাম চাপলে কিবোর্ডের মতোই কাজ করে ----------
function bindTouch(id, key) {
  const b = document.getElementById(id);
  const down = e => { e.preventDefault(); b.classList.add('on');
    if (key === ' ') { if (running) honk(); } else keys[key] = true; };
  const up = e => { e.preventDefault(); b.classList.remove('on'); if (key !== ' ') keys[key] = false; };
  b.addEventListener('pointerdown', down);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => b.addEventListener(t, up));
}
bindTouch('bL', 'ArrowLeft'); bindTouch('bR', 'ArrowRight'); bindTouch('bH', ' ');
bindTouch('bG', 'ArrowUp'); bindTouch('bB', 'ArrowDown');   // গতি বাড়ানো ও ব্রেক

</script>
